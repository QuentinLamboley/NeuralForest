name: PU frozen-hidden-feature ablation
on:
  push:
    branches: [main]
    paths:
      - 'R/pu_hidden_forest.R'
      - 'R/pu.R'
      - 'R/pu_verified_gate.R'
      - 'src/pu_latent.cpp'
      - 'benchmark/pu_hidden_pilot.py'
      - 'benchmark/pu_hidden_pilot_r.R'
      - '.github/workflows/pu-hidden-feature.yml'
  pull_request:
    paths:
      - 'R/pu_hidden_forest.R'
      - 'R/pu.R'
      - 'R/pu_verified_gate.R'
      - 'src/pu_latent.cpp'
      - 'tests/testthat/test-pu-hidden-forest.R'
      - 'benchmark/pu_hidden_pilot.py'
      - 'benchmark/pu_hidden_pilot_r.R'
      - '.github/workflows/pu-hidden-feature.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pu-hidden-feature
  cancel-in-progress: true
jobs:
  paired_experiment:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::Rcpp, any::jsonlite, any::testthat
          needs: check
      - name: Python evaluation environment
        run: |
          python -m pip install "numpy>=1.26,<3" "pandas>=2.2,<4" "scipy>=1.12,<2" "scikit-learn>=1.5,<2" "xgboost>=2,<4" "catboost>=1.2,<2"
      - name: Compile C++17 and check source contracts
        run: |
          python -m compileall -q benchmark/pu_hidden_pilot.py
          Rscript -e 'parse(file="R/pu_hidden_forest.R");parse(file="benchmark/pu_hidden_pilot_r.R");Rcpp::compileAttributes(".")' >/dev/null
          R CMD INSTALL .
      - name: Native hidden unit, OOB alignment and teacher-equivalence tests
        run: Rscript -e 'library(NeuralForest);testthat::test_file("tests/testthat/test-pu-hidden-forest.R")'
      - name: Test raw versus hidden forests with disjoint verified audit
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          NUMEXPR_NUM_THREADS: '1'
          PYTHONHASHSEED: '0'
        run: python benchmark/pu_hidden_pilot.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pu-frozen-hidden-vs-raw-paired-ablation
          path: audit/pu_hidden_feature_results/
          if-no-files-found: warn

      - name: Publish exact ten-seed paired benchmark results
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/pu_hidden_feature_results/
          if ! git diff --cached --quiet; then
            git commit -m "Record ten-seed neural hidden-vs-random ablation [skip ci]"
            # Rcpp compileAttributes may have modified tracked exports in
            # this ephemeral runner: discard ONLY unstaged working tree
            # changes after committing benchmark results.
            git reset --hard HEAD
            git pull --rebase origin main
            git push origin HEAD:main
          fi
