name: PU unseen-source transport challenge
on:
  push:
    branches: [main]
    paths:
      - 'audit/pu_unseen_domain.py'
      - 'audit/pu_attribution.py'
      - 'benchmark/fit_pu_r.R'
      - 'R/**'
      - 'src/**'
      - '.github/workflows/pu-unseen-domain.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: pu-unseen-source
  cancel-in-progress: false
jobs:
  challenge:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: QuentinLamboley/td-machinelearning
          ref: 48c2b28ca7874cbef1f7dde15de962c6e56c5027
          path: td-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::Rcpp, any::jsonlite, any::ranger
          needs: check
      - name: Install baseline estimators
        run: |
          python -m pip install "numpy>=1.26,<3" "pandas>=2.2,<4" "scipy>=1.12,<2" "scikit-learn>=1.5,<2" "xgboost>=2,<4" "lightgbm>=4,<5" "catboost>=1.2,<2" "imbalanced-learn>=0.14,<1"
      - name: Verify scripts and R package
        run: |
          python -m compileall -q audit/pu_unseen_domain.py audit/pu_attribution.py
          python -m unittest discover -s benchmark -p 'test_pu_attribution.py'
          Rscript -e 'parse(file="benchmark/fit_pu_r.R")' >/dev/null
          R CMD INSTALL .
      - name: Evaluate unseen diabetes progression source
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          NUMEXPR_NUM_THREADS: '1'
          PYTHONHASHSEED: '0'
        run: python audit/pu_unseen_domain.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pu-unseen-source-scar-sar
          path: audit/pu_unseen_results/
          if-no-files-found: warn
      - name: Publish reproducible fourth-source outcomes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/pu_unseen_results/
          if ! git diff --staged --quiet; then
            git commit -m "Record 60 unseen-source PU prediction records [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
