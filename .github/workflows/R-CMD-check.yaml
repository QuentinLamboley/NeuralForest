name: R CMD check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  R-CMD-check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::testthat
          needs: check
      - name: Rebuild Rcpp interfaces
        run: Rscript -e 'Rcpp::compileAttributes(".")'
      - name: Check
        run: Rscript -e 'rcmdcheck::rcmdcheck(".", args=c("--no-manual"), error_on="error")'
