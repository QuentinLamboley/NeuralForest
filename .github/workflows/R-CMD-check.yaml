name: R CMD check
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  R-CMD-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck, any::testthat
          needs: check
      - name: Compile Rcpp attributes
        run: Rscript -e 'Rcpp::compileAttributes(".")'
      - name: Check
        run: Rscript -e 'rcmdcheck::rcmdcheck(".", args=c("--no-manual"), error_on="error")'
