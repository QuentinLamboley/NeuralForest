name: Independent real-data PU validation
on:
  push:
    branches: [main]
    paths:
      - 'audit/real_pu_benchmark.py'
      - 'audit/pair_real_v07.py'
      - 'audit/pair_real_v08.py'
      - 'benchmark/run.py'
      - 'benchmark/fit_pu_r.R'
      - 'R/**'
      - 'src/**'
      - 'DESCRIPTION'
      - '.github/workflows/real-pu-validation.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: real-pu-validation
  cancel-in-progress: false
jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: QuentinLamboley/td-machinelearning
          ref: 48c2b28ca7874cbef1f7dde15de962c6e56c5027
          path: td-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::Rcpp, any::jsonlite, any::ranger
          needs: check
      - name: Install benchmark estimators
        run: |
          python -m pip install "numpy>=1.26,<3" "pandas>=2.2,<4" "scipy>=1.12,<2" "scikit-learn>=1.5,<2" "xgboost>=2,<4" "lightgbm>=4,<5" "catboost>=1.2,<2" "imbalanced-learn>=0.14,<1"
      - name: Parse all R benchmark and PU sources
        run: |
          Rscript -e 'parse(file="benchmark/fit_pu_r.R"); parse(file="R/pu_stable.R")' >/dev/null
      - name: Install NeuralForest
        run: R CMD INSTALL .
      - name: Validate 36 predictions on public data with SCAR and SAR
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          NUMEXPR_NUM_THREADS: '1'
          PYTHONHASHSEED: '0'
        run: |
          python audit/real_pu_benchmark.py
          python audit/pair_real_v07.py
          python audit/pair_real_v08.py
          python audit/pu_attribution.py --domain real
      - uses: actions/upload-artifact@v4
        with:
          name: neuralforest-real-pu-scar-sar-648-evaluations
          path: audit/real_pu_results/
          if-no-files-found: error
      - name: Publish independently labelled test outcomes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add audit/real_pu_results/
          if ! git diff --staged --quiet; then
            git commit -m "Record 297 real-data PU validation results"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
