name: Vampire benchmark
on:
  push:
    branches: [main]
    paths:
      - 'benchmark/**'
      - '!benchmark/results/**'
      - 'R/**'
      - 'src/**'
      - 'tests/**'
      - 'DESCRIPTION'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: vampire-benchmark
  cancel-in-progress: true
jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        group: [core, imbalance, structure, presence, stress]
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: QuentinLamboley/td-machinelearning
          ref: 48c2b28ca7874cbef1f7dde15de962c6e56c5027
          path: td-source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::Rcpp, any::jsonlite, any::ranger
          needs: check
      - name: Install Python estimators
        run: |
          python -m pip install "numpy>=1.26,<3" "pandas>=2.2,<4" "scipy>=1.12,<2" "scikit-learn>=1.5,<2" "xgboost>=2,<4" "lightgbm>=4,<5" "catboost>=1.2,<2" "imbalanced-learn>=0.14,<1"
      - name: Validate Python scripts and simulator
        run: |
          python -m compileall -q benchmark
          python -m unittest discover -s benchmark -p 'test_*.py'
      - name: Parse all R benchmark and PU sources
        run: |
          Rscript -e 'parse(file="benchmark/fit_pu_r.R"); parse(file="R/pu_stable.R")' >/dev/null
      - name: Install NeuralForest
        run: R CMD INSTALL .
      - name: Run evaluation
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          NUMEXPR_NUM_THREADS: '1'
          PYTHONHASHSEED: '0'
        run: python benchmark/run.py --group ${{ matrix.group }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: vampire-benchmark-${{ matrix.group }}
          path: benchmark/out/
          if-no-files-found: warn
  summarize:
    needs: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: vampire-benchmark-*
          path: benchmark/out/
          merge-multiple: true
      - name: Install summarization dependencies
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2.2,<4" "scipy>=1.12,<2"
      - name: Aggregate external test metrics
        run: |
          python benchmark/summarize.py
          python audit/pair_v03.py
          python audit/pair_v041.py
          python audit/pair_v05.py
          python audit/pair_v06.py
          python audit/pair_v07.py
      - uses: actions/upload-artifact@v4
        with:
          name: vampire-benchmark-results
          path: benchmark/results/
      - name: Publish benchmark tables
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmark/results/
          if ! git diff --staged --quiet; then
            git commit -m "Record reproducible vampire benchmark measurements"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
