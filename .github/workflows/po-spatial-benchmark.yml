name: Presence-only spatial SDM benchmark
on:
  pull_request:
    paths:
      - 'R/po_forest.R'
      - 'src/po_ipp.cpp'
      - 'src/RcppExports.cpp'
      - 'R/RcppExports.R'
      - 'benchmark/po_spatial_*'
      - 'tests/testthat/test-po-ipp.R'
      - '.github/workflows/po-spatial-benchmark.yml'
  push:
    branches: [main]
    paths:
      - 'R/po_forest.R'
      - 'src/po_ipp.cpp'
      - 'benchmark/po_spatial_*'
      - '.github/workflows/po-spatial-benchmark.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: po-spatial-${{ github.ref }}
  cancel-in-progress: true
jobs:
  benchmark:
    strategy:
      fail-fast: false
      matrix:
        scenario: [linear, nonlinear_interaction, multimodal]
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::Rcpp, any::jsonlite, any::ranger, any::mgcv, any::maxnet, any::testthat
          needs: check
      - name: Install matching Python estimators
        run: |
          python -m pip install "numpy>=1.26,<3" "pandas>=2.2,<4" "scipy>=1.12,<2" "scikit-learn>=1.5,<2" "xgboost>=2,<4" "catboost>=1.2,<2"
      - name: Static compile, design leakage tests and native package install
        run: |
          python -m compileall -q benchmark/po_spatial_design.py benchmark/po_spatial_run.py benchmark/po_spatial_summarize.py
          python -m unittest discover -s benchmark -p 'test_po_spatial*.py' -v
          Rscript -e 'parse(file="R/po_forest.R");parse(file="benchmark/po_spatial_models.R")' >/dev/null
          Rscript -e 'Rcpp::compileAttributes(".")'
          R CMD INSTALL .
          Rscript -e 'library(NeuralForest);testthat::test_file("tests/testthat/test-po-ipp.R")'
      - name: Record model and runner versions
        run: |
          mkdir -p benchmark/po_spatial_out
          python -m pip freeze > benchmark/po_spatial_out/python-dependencies.txt
          Rscript -e 'capture.output(sessionInfo(),file="benchmark/po_spatial_out/R-session.txt")'
      - name: Five spatial blocks across two independent simulation seeds
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          NUMEXPR_NUM_THREADS: '1'
          PYTHONHASHSEED: '0'
        run: |
          python benchmark/po_spatial_run.py --scenario ${{ matrix.scenario }} --seeds 8101,8231 --folds 0,1,2,3,4
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: po-spatial-${{ matrix.scenario }}
          path: benchmark/po_spatial_out/
          if-no-files-found: warn
  summarize:
    needs: benchmark
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: po-spatial-*
          path: benchmark/po_spatial_out/
          merge-multiple: true
      - name: Install audit dependencies
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2.2,<4" "scipy>=1.12,<2"
      - name: Aggregate all methods without filtering unfavorable cases
        run: python benchmark/po_spatial_summarize.py
      - uses: actions/upload-artifact@v4
        with:
          name: po-spatial-all-results
          path: benchmark/po_spatial_results/
      - name: Publish versioned benchmark results on main
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmark/po_spatial_results/
          if ! git diff --staged --quiet; then
            git commit -m "Record spatial-block presence-only SDM benchmark [skip ci]"
            git reset --hard HEAD
            git pull --rebase origin main
            git push origin HEAD:main
          fi
