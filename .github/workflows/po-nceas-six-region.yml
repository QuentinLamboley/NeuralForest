name: NCEAS six-region presence-only and IPP-gradient independent survey
on:
  pull_request:
    paths:
      - 'benchmark/po_nceas_multi_*'
      - 'benchmark/test_po_nceas_multi.py'
      - '.github/workflows/po-nceas-six-region.yml'
  push:
    branches: [main]
    paths:
      - 'benchmark/po_nceas_multi_*'
      - '.github/workflows/po-nceas-six-region.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: po-nceas-six-region-${{ github.ref }}
  cancel-in-progress: true
jobs:
  region:
    strategy:
      fail-fast: false
      matrix:
        region: [AWT, CAN, NSW, NZ, SA, SWI]
    runs-on: ubuntu-latest
    timeout-minutes: 110
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::Rcpp, any::jsonlite, any::disdat, any::maxnet, any::ranger, any::mgcv, any::testthat
          needs: check
      - name: Install compiled Python comparators
        run: |
          python -m pip install "numpy>=1.26,<3" "pandas>=2.2,<4" "scipy>=1.12,<2" "scikit-learn>=1.5,<2" "xgboost>=2,<4" "catboost>=1.2,<2"
      - name: Verify reproducibility, no leakage and native package
        run: |
          python -m compileall -q benchmark/po_nceas_multi_run.py benchmark/po_nceas_multi_summarize.py benchmark/test_po_nceas_multi.py
          python -m unittest discover -s benchmark -p 'test_po_nceas_multi.py' -v
          Rscript -e 'parse(file="benchmark/po_nceas_multi_export.R");parse(file="benchmark/po_nceas_multi_models.R");stopifnot(as.character(packageVersion("disdat")) >= "1.1.0")' >/dev/null
          Rscript -e 'Rcpp::compileAttributes(".")'
          R CMD INSTALL .
          Rscript -e 'library(NeuralForest); stopifnot(is.function(nf_po_forest), is.function(nf_po_gradient_forest))'
      - name: Independent survey evaluation across fixed 20 methods
        env:
          OPENBLAS_NUM_THREADS: '1'
          OMP_NUM_THREADS: '1'
          MKL_NUM_THREADS: '1'
          NUMEXPR_NUM_THREADS: '1'
          PYTHONHASHSEED: '0'
        run: |
          python benchmark/po_nceas_multi_run.py --region ${{ matrix.region }} --max-species 4 --min-presences 70
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: nceas-six-region-${{ matrix.region }}
          path: |
            benchmark/po_nceas_multi_out/${{ matrix.region }}.csv
            benchmark/po_nceas_multi_out/${{ matrix.region }}.json
          if-no-files-found: warn
  summarize:
    needs: region
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@v4
        with:
          pattern: nceas-six-region-*
          path: benchmark/po_nceas_multi_out/
          merge-multiple: true
      - name: Install audit dependencies
        run: python -m pip install "numpy>=1.26,<3" "pandas>=2.2,<4" "scipy>=1.12,<2"
      - name: Require all six regions and produce unfiltered paired report
        run: python benchmark/po_nceas_multi_summarize.py
      - uses: actions/upload-artifact@v4
        with:
          name: nceas-six-region-complete-audit
          path: benchmark/po_nceas_multi_results/
          if-no-files-found: error
      - name: Publish only aggregate benchmark scores to main
        if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add benchmark/po_nceas_multi_results/
          if ! git diff --staged --quiet; then
            git commit -m "Record six-region NCEAS independent-survey audit [skip ci]"
            git reset --hard HEAD
            git pull --rebase origin main
            git push origin HEAD:main
          fi
